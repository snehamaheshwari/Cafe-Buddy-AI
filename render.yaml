services:
  - type: web
    name: cafe-buddy
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Optional — set your key in Render dashboard to enable Claude AI mode
      # - key: ANTHROPIC_API_KEY
      #   sync: false
